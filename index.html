<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オリキャラ図鑑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
:root{--bg:#e9f0f2;--sf:#fff;--ink:#14232e;--sub:#5b6b76;--ln:#cfdbe0;--ac:#0f6b7a;--ac2:#e0f0f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--sf:#172730;--ink:#e6eef1;--sub:#93a6b0;--ln:#2a3d47;--ac:#5fc3d4;--ac2:#1d3640}}
:root[data-theme="dark"]{--bg:#0f1a20;--sf:#172730;--ink:#e6eef1;--sub:#93a6b0;--ln:#2a3d47;--ac:#5fc3d4;--ac2:#1d3640}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
.k{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:800}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 16px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 12px 0 0;font-weight:700;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
input[type=search],select{font:inherit;font-size:14px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;min-height:36px}
input[type=search]{flex:1 1 220px;min-width:0}
select{max-width:46vw}
label.t{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);cursor:pointer}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 12px;min-height:36px;cursor:pointer}
button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;display:block;flex:1 1 auto;min-width:0;width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--ac)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tile{display:flex;align-items:center;justify-content:center;height:92px;font-size:50px;line-height:1}
.tile{position:relative;overflow:hidden}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:3px}.tile.has{color:transparent!important}.dh .tile.has{width:148px;height:148px;cursor:zoom-in}#lb{background:transparent;width:auto;max-width:96vw;overflow:visible;border-radius:0}#lb img{display:block;max-width:96vw;max-height:92dvh;border-radius:8px;background:var(--sf);cursor:zoom-out}
[hidden]{display:none!important}
nav{display:flex;gap:6px;max-width:1280px;margin:8px auto 0}nav button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
#bn{max-width:1280px;margin:6px auto 0;font-size:13px}#bn:empty{display:none}
.cw{position:relative;display:flex;min-width:0}.cmp{position:absolute;top:6px;right:6px;font-size:12px;min-height:26px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.92);color:#14232e}
.cmp[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}.cmpd,.ptd{margin:6px 6px 0 0;font-size:13px;min-height:30px}.sm b.bad{color:#e5484d}#party input[type=number],#party input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;min-height:36px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.slot{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px;min-height:160px}.slot.add{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed var(--ln);border-radius:10px;color:var(--sub);cursor:pointer}.slot.add:hover{border-color:var(--ac);color:var(--ac)}.slot .sb{all:unset;display:block;width:100%;cursor:pointer;font-weight:700;font-size:14px}.slot .tile{height:76px;font-size:42px;border-radius:6px;margin-bottom:4px}.slot .rm{position:absolute;top:12px;right:12px;z-index:2;min-height:24px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.92);color:#14232e}
.mx{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}.mx th,.mx td{padding:3px 6px;text-align:center;border-bottom:1px solid var(--ln);font-weight:400}.mx th{font-size:12px;color:var(--sub);vertical-align:bottom}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--sf);font-weight:700}.mx tr.warn td:first-child{color:#e5484d}.e0{background:#4b5563;color:#fff}.e1{background:rgba(46,164,79,.3)}.e2{background:rgba(245,158,11,.4)}.e4{background:rgba(229,72,77,.55);font-weight:700}.pn .tp{margin:0 4px 4px 0;display:inline-block}
#tray{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;flex-wrap:wrap}#tray.on{display:flex}
main{padding-bottom:84px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;background:var(--bg)}.chip i{width:10px;height:10px;border-radius:50%}.chip button{min-height:22px;padding:0 6px;border:0;background:none}
#cd{width:min(980px,100vw)}.ct{border-collapse:collapse;font-size:13px;table-layout:fixed;width:100%}.ct th,.ct td{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.ct th:first-child,.ct td:first-child{position:sticky;left:0;z-index:1;background:var(--sf);color:var(--sub);width:84px}.ct td.b{background:var(--ac2);font-weight:700}.ct .tile{width:56px;height:56px;font-size:32px;border-radius:8px;margin-bottom:4px}
.rr{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.6em 44px 1fr minmax(90px,38%);gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--ln);cursor:pointer;width:100%}.rr:hover{background:var(--ac2)}.rr:focus-visible{outline:2px solid var(--ac)}
.rr .tile{width:44px;height:44px;font-size:26px;border-radius:6px}.rr .rn{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}.rr .rv2{display:block;text-align:right;font-variant-numeric:tabular-nums}.rr .bar{display:block;margin-top:3px}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:16px}.pn h3{margin:0 0 8px;font-size:15px}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.sm div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--sub)}.sm b{display:block;font-size:17px;color:var(--ink)}
.mo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.mo section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}.mo section.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.mo h4{margin:0 0 4px;font-size:14px}.mo button{all:unset;display:block;cursor:pointer;font-size:13px;padding:1px 0}.mo button:hover{color:var(--ac)}.mo button:focus-visible{outline:2px solid var(--ac)}
.cb{padding:8px 10px 10px}
.nm{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.no{font-size:12px;color:var(--sub)}
.ty{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.tp{font-size:12px;padding:0 7px;border-radius:99px;line-height:20px;color:#14232e;font-weight:500}
.bst{font-size:12px;color:var(--sub)}
.bst b{color:var(--ink);font-size:14px}
.empty{padding:48px 0;text-align:center;color:var(--sub)}
dialog{border:0;padding:0;background:var(--sf);color:var(--ink);width:min(720px,100vw);max-width:100vw;max-height:100dvh;border-radius:12px;overflow:auto}
dialog::backdrop{background:rgba(5,15,20,.6)}
.dh{display:flex;gap:16px;align-items:center;padding:20px}
.dh .tile{width:104px;height:104px;border-radius:10px;font-size:62px;flex:none}
.dh h2{margin:0;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.dh .no{margin-top:2px}
.x{position:sticky;top:0;float:right;margin:10px}
.sec{padding:0 20px 18px}
.sec h3{font-size:14px;margin:0 0 8px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--ln);padding-bottom:4px}
dl{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--sub)}dd{margin:0;overflow-wrap:anywhere}
.st{display:grid;grid-template-columns:1.6em 1fr 2.8em;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--ac2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.st .v{text-align:right;font-variant-numeric:tabular-nums}.st .v.ov{color:#9b6fd6;font-weight:700}.st .v.ov2{color:#e5484d;font-weight:700}
.bar{position:relative}.bar u{position:absolute;left:0;top:0;height:100%;background:#8a5cc2;text-decoration:none;border-radius:5px}.bar u.r{background:#e5484d}
.stw{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}.stw .st{flex:1 1 240px}.stw svg{flex:0 1 250px;width:250px;max-width:100%;overflow:visible;margin:0 auto}
.rg{fill:none;stroke:var(--ln);stroke-width:1}.rg.r2{stroke:var(--sub);stroke-width:1.5}.rf{fill:var(--ac);fill-opacity:.28}.rs{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}.ro{fill:#8a5cc2;fill-opacity:.85}.rl{font-size:11px;fill:var(--ink)}.rl.ov{fill:#9b6fd6;font-weight:700}.nt{font-size:12px;color:var(--sub);margin:8px 0 0}
.ab{margin:0 0 8px;font-size:14px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--ln);vertical-align:-2px;margin-right:4px}
.sy{font-size:12px;color:var(--sub)}#sync label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}#sync input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.cc{background:var(--ac2);border-radius:8px;padding:10px 12px}.ln{all:unset;color:var(--ac);text-decoration:underline;cursor:pointer}
@media(max-width:520px){.dh{padding:16px}.dh .tile{width:84px;height:84px;font-size:48px}dl{grid-template-columns:6.5em 1fr}}
</style>
</head>
<body>
<header>
 <div class="row"><h1>オリキャラ図鑑<small id="cnt"></small></h1>
 <input id="q" type="search" placeholder="名前・読み・漢字・特性・技で検索" aria-label="検索"><button id="syb">データ更新</button><span class="sy" id="sst"></span></div>
 <nav><button data-t="grid" aria-selected="true">図鑑</button><button data-t="rank" aria-selected="false">ランキング</button><button data-t="party" aria-selected="false">パーティ</button><button data-t="bday" aria-selected="false">誕生日</button></nav><div id="bn"></div>
</header>
<div class="row" id="ctl" style="padding:12px 16px 0"></div>
<main><div id="grid"></div><div id="rank" hidden></div><div id="party" hidden></div><div id="bday" hidden></div></main>
<dialog id="pk"><div class="sec" style="padding-top:16px"><div class="row" style="margin-bottom:8px"><input id="pks" type="search" placeholder="名前・タイプ・族で検索" style="flex:1 1 200px"><button id="pkx">閉じる</button></div><div id="pkl"></div></div></dialog>
<div id="tray"></div><dialog id="cd"></dialog>
<dialog id="dlg"></dialog>
<dialog id="lb"><img alt=""></dialog>
<dialog id="sync"><div class="sec" style="padding-top:20px"><h3>データ更新</h3><label for="url">スプレッドシートのURL（「リンクを知っている全員が閲覧可」にしておく）</label><input id="url" type="text" placeholder="https://docs.google.com/spreadsheets/d/…"><label for="url2">タイプ相性シートのURL（任意。そのタブを開いたときのURL）</label><input id="url2" type="text" placeholder="https://docs.google.com/spreadsheets/d/…/edit?gid=…"><div class="bt"><button id="go">URLから取得</button><button id="fb">CSVファイルを選ぶ</button><input id="fi" type="file" accept=".csv,text/csv" hidden><button id="xc">閉じる</button></div><p class="sy" id="sm"></p></div></dialog>

 $('#bday').innerHTML=`<div class="pn"><h3>${t0.getMonth()+1}月${t0.getDate()}日（今日）</h3>${td.length?rows(td,x=>`${x.mo}月${x.d}日`):`<p class="no" style="margin:0 0 6px">今日が誕生日のキャラはいません。</p>${nextL.length?`<p class="no" style="margin:0">次は${nextL[0].mo}月${nextL[0].d}日（あと${nextD}日）：</p>${rows(nextL,x=>`${x.mo}月${x.d}日`)}`:''}`}</div>
 <div class="pn"><h3>もうすぐ（30日以内）</h3>${near.length?rows(near,x=>`${x.mo}月${x.d}日<br><span class="no">あと${x.days}日</span>`):'<p class="no" style="margin:0">30日以内の誕生日はありません。</p>'}</div>
 <div class="pn"><h3>誕生日カレンダー</h3><div class="mo">${cal}</div><p class="nt">誕生日が分かっているのは ${L.length} / ${total}体です。</p></div>`;hydrate()}
function tab(t){st.tab=t;['grid','rank','party','bday'].forEach(k=>$('#'+k).hidden=k!==t);$('#ctl').hidden=t!=='grid';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));if(t==='rank')renderRank();if(t==='bday')renderBday();if(t==='party')renderParty();if(t==='grid')hydrate();scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)});
$('#bn').addEventListener('click',()=>tab('bday'));$('#bn').style.cursor='pointer';
$('#tray').addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){tog(+r.dataset.rm);return}if(e.target.id==='cgo')cmpShow();if(e.target.id==='ccl'){CMP.length=0;tray()}});
$('#cd').addEventListener('click',e=>{if(e.target.id==='cdx'||e.target===$('#cd'))$('#cd').close()});
$('#rank').addEventListener('change',e=>{const t=e.target;if(t.id==='rm')RK.m=+t.value;else if(t.id==='rg'){RK.g=t.value;fillRv()}else if(t.id==='rv')RK.v=t.value;else if(t.id==='rn')RK.n=+t.value;else if(t.id==='rb')RK.gb=t.value;else if(t.id==='rx')RK.min=+t.value;rankBody();hydrate()});

let TCH=parseChart(TCSV),PTID=null;
const ids=()=>{if(!PTID){try{PTID=JSON.parse(LS.g('oc_party')||'[]')}catch(e){PTID=[]}}return PTID};
const mem=()=>ids().map(id=>DATA.find(c=>c['全界番号']===id)).filter(Boolean),savePt=()=>LS.s('oc_party',JSON.stringify(ids()));
const svd=()=>{try{return JSON.parse(LS.g('oc_parties')||'{}')}catch(e){return{}}};
const mult=(a,d)=>(TCH.M[a]&&TCH.M[a][d])??1,eff=(c,a)=>tys(c).reduce((p,t)=>p*mult(a,t),1);
const ev=m=>m===1?'':m===0?'0':m===.25?'¼':m===.5?'½':String(m),ec=m=>m===0?'e0':m<1?'e1':m>=4?'e4':m>1?'e2':'';
const fmtM=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v);
function addP(id){const a=ids();if(a.includes(id)){$('#sst').textContent='すでに入っています';return}if(a.length>=6){$('#sst').textContent='パーティは6体までです';return}a.push(id);savePt();$('#sst').textContent='パーティに追加しました';if(st.tab==='party')renderParty()}
function renderParty(){const L=mem(),sum=k=>L.reduce((s,c)=>s+(num(c[k])||0),0),cost=sum('コスト'),lim=num(LS.g('oc_plim')),bs=L.map(c=>num(c['合計種族値'])).filter(Boolean),avg=bs.length?bs.reduce((a,b)=>a+b,0)/bs.length:0,over=lim!=null&&cost>lim;
 const slots=Array.from({length:6},(_,k)=>{const c=L[k];return c?`<div class="slot"><button class="rm" data-pr="${esc(c['全界番号'])}" aria-label="外す">×</button><button class="sb" data-i="${c._i}">${tile(c)}${esc(c['キャラ名'])}</button><div class="ty">${chips(c)}</div><div class="no">コスト ${esc(c['コスト']||'-')} ・ 種族値 ${esc(c['合計種族値']||'-')}</div></div>`:`<button class="slot add" data-pa>＋ 追加</button>`}).join('');
 let ana='<div class="pn"><p class="no" style="margin:0">キャラを追加すると、相性や平均ステータスの分析が出ます。</p></div>';
 if(L.length){const Ts=Object.keys(TCH.M),rows=Ts.map(a=>{const v=L.map(c=>eff(c,a));return{a,v,w:v.filter(x=>x>1).length,r:v.filter(x=>x<1).length}}).sort((x,y)=>(y.w-y.r)-(x.w-x.r)),risk=rows.filter(x=>x.w>x.r&&x.w>=2);
  const at=[...new Set(L.flatMap(tys))],unc=Ts.map(d=>({d,b:Math.max(...at.map(a=>mult(a,d)))})).filter(x=>x.b<2),av={};SK.forEach(k=>{const v=L.map(c=>num(c[k])).filter(x=>x!=null);av[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0});
  ana=`<div class="pn"><h3>平均ステータス</h3>${bs.length?statsHtml(av):'<div class="no">種族値が未設定です</div>'}</div>
  <div class="pn"><h3>守りの弱点</h3><p class="nt" style="margin:0 0 8px">2体以上が弱点で、耐性を持つ数より弱点の数が多いタイプです。</p>${risk.length?risk.slice(0,12).map(x=>`<span class="tp" style="background:${tc(x.a)}">${esc(x.a)} 弱${x.w}/耐${x.r}</span>`).join(''):'<span class="no">目立った弱点はありません</span>'}
  <div style="overflow-x:auto;margin-top:10px"><table class="mx"><thead><tr><th>攻撃↓</th>${L.map(c=>`<th>${esc(c['キャラ名'])}</th>`).join('')}<th>弱</th><th>耐</th></tr></thead><tbody>${rows.filter(x=>x.w||x.r).map(x=>`<tr${risk.includes(x)?' class="warn"':''}><td>${esc(x.a)}</td>${x.v.map(m=>`<td class="${ec(m)}">${ev(m)}</td>`).join('')}<td>${x.w||''}</td><td>${x.r||''}</td></tr>`).join('')}</tbody></table></div><p class="nt">${rows.filter(x=>!x.w&&!x.r).length}タイプは全員が等倍のため省略しています。特性による変化は含みません。</p></div>
  <div class="pn"><h3>攻めの穴</h3><p class="nt" style="margin:0 0 8px">メンバー自身のタイプの技で、抜群（×2以上）を取れない相手タイプです（単タイプ相手で計算）。${Ts.length-unc.length}/${Ts.length}タイプをカバー。</p>${unc.length?unc.map(x=>`<span class="tp" style="background:${tc(x.d)}">${esc(x.d)}${x.b<1?' ×'+x.b:''}</span>`).join(''):'<span class="no">全タイプに抜群を取れます</span>'}</div>`}
 const sv=svd();
 $('#party').innerHTML=`<div class="pn"><h3>パーティ（${L.length}/6）</h3><div class="slots">${slots}</div></div>
 <div class="pn"><div class="sm"><div>人数<b>${L.length}/6</b></div><div>コスト合計<b class="${over?'bad':''}">${fmt(cost)}${lim!=null?' / '+fmt(lim):''}</b></div><div>平均種族値<b>${fmt(avg)}</b></div><div>戦闘力合計<b>${fmtM(sum('戦闘力(並び替え用)'))}</b></div><div>CP合計<b>${fmt(sum('CP'))}</b></div></div>
 <div class="row" style="margin-top:10px"><label class="t">コスト上限 <input id="plim" type="number" step="0.5" min="0" value="${lim!=null?lim:''}" style="width:6.5em" placeholder="なし"></label><button id="psh"${L.length?'':' disabled'}>共有URLをコピー</button><button id="pcl"${L.length?'':' disabled'}>全部外す</button></div></div>
 ${ana}
 <div class="pn"><h3>保存したパーティ</h3><div class="row"><input id="pname" type="text" placeholder="パーティ名" style="flex:1 1 160px"><button id="psv"${L.length?'':' disabled'}>今の編成を保存</button></div>${Object.keys(sv).map(n=>`<div class="row" style="margin-top:6px"><b style="flex:1 1 auto">${esc(n)}</b><span class="no">${sv[n].length}体</span><button data-pl="${esc(n)}">読み込む</button><button data-pd="${esc(n)}">削除</button></div>`).join('')}</div>`;hydrate()}
function pkList(){const q=$('#pks').value.trim().toLowerCase(),have=ids(),a=DATA.filter(c=>!have.includes(c['全界番号'])&&(!q||c._s.includes(q)||(c['タイプ']||'').includes(q)||(c['族']||'').toLowerCase().includes(q))).slice(0,80);$('#pkl').innerHTML=a.map(c=>rrow(c,'',`コスト ${esc(c['コスト']||'-')}<br><span class="no">種族値 ${esc(c['合計種族値']||'-')}</span>`)).join('')||'<div class="empty">該当なし</div>';hydrate()}
$('#pks').addEventListener('input',pkList);$('#pkx').onclick=()=>$('#pk').close();
$('#pkl').addEventListener('click',e=>{const r=e.target.closest('.rr');if(r){addP(DATA[+r.dataset.i]['全界番号']);$('#pk').close()}});
$('#party').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.pa!==undefined){$('#pks').value='';pkList();$('#pk').showModal();$('#pks').focus();return}
 if(t.dataset.pr){const a=ids(),k=a.indexOf(t.dataset.pr);if(k>=0)a.splice(k,1);savePt();renderParty();return}
 if(t.id==='pcl'){ids().length=0;savePt();renderParty();return}
 if(t.id==='psh'){const u=location.href.split('#')[0]+'#p='+encodeURIComponent(ids().join('~'));(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$('#sst').textContent='共有URLをコピーしました'},()=>prompt('このURLをコピーしてください',u));return}
 if(t.id==='psv'){const n=$('#pname').value.trim();if(!n){$('#sst').textContent='パーティ名を入れてください';return}const s=svd();s[n]=ids().slice();LS.s('oc_parties',JSON.stringify(s));renderParty();return}
 if(t.dataset.pl){PTID=(svd()[t.dataset.pl]||[]).slice(0,6);savePt();renderParty();return}
 if(t.dataset.pd){const s=svd();delete s[t.dataset.pd];LS.s('oc_parties',JSON.stringify(s));renderParty()}});
$('#party').addEventListener('change',e=>{if(e.target.id==='plim'){LS.s('oc_plim',e.target.value);renderParty()}});
function apply(csv){DATA=parseCSV(csv);prep();buildCtl();Object.entries(st.f).forEach(([k,v])=>{const s=document.querySelector(`select[data-f="${k}"]`);if(s)s.value=v});$('#sort').value=st.sort;$('#cc').checked=st.cc;$('#nost').checked=st.nost;$('#il').checked=st.il;$('#dir').textContent=st.desc?'降順':'昇順';CMP.length=0;bdInit();view();if(st.tab==='rank')renderRank();if(st.tab==='bday')renderBday();if(st.tab==='party')renderParty()}
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const hm=d=>d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
async function fetchSheet(url,key='キャラ名'){const m=url.match(/\/d\/([\w-]+)/);if(!m)throw new Error('URLの形式が違います');const g=(url.match(/[#&?]gid=(\d+)/)||[,'0'])[1],b='https://docs.google.com/spreadsheets/d/'+m[1];
 for(const u of [b+'/export?format=csv&gid='+g,b+'/gviz/tq?tqx=out:csv&gid='+g]){try{const r=await fetch(u);if(r.ok){const t=await r.text();if(t.includes(key))return t}}catch(e){}}
 throw new Error('取得できませんでした。この表示環境ではGoogleに直接アクセスできない、または共有設定が「リンクを知っている全員」になっていない可能性があります。')}
function got(csv,label){apply(csv);LS.s('oc_csv',csv);LS.s('oc_time',Date.now());$('#sst').textContent=label+' '+hm(new Date())}
async function sync(url,manual){const sm=$('#sm');if(manual)sm.textContent='取得中…';try{const t=await fetchSheet(url);LS.s('oc_url',url);got(t,'シートから取得');const u2=LS.g('oc_url2');if(u2){try{const ch=await fetchSheet(u2,'攻撃');TCH=parseChart(ch);LS.s('oc_chart',ch);LS.s('oc_ctime',Date.now());if(st.tab==='party')renderParty()}catch(e){}}if(manual){sm.textContent='反映しました（'+DATA.length+'件）';$('#sync').close()}}catch(e){if(manual)sm.textContent=e.message;else $('#sst').textContent='自動取得できず（保存データを表示中）'}}
$('#syb').onclick=()=>{$('#url').value=LS.g('oc_url')||SHEET;$('#url2').value=LS.g('oc_url2')||'';$('#sm').textContent='';$('#sync').showModal()};
$('#lb').addEventListener('click',()=>$('#lb').close());
$('#xc').onclick=()=>$('#sync').close();
$('#go').onclick=()=>{LS.s('oc_url2',$('#url2').value.trim());sync($('#url').value.trim(),true)};
$('#fb').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();if(!t.includes('キャラ名')){if(t.includes('攻撃')){TCH=parseChart(t);LS.s('oc_chart',t);LS.s('oc_ctime',Date.now());$('#sm').textContent='タイプ相性を読み込みました';if(st.tab==='party')renderParty();return}$('#sm').textContent='キャラ名の列が見つかりません';return}got(t,'CSVを読み込み');$('#sm').textContent='反映しました（'+DATA.length+'件）';$('#sync').close()};
const cache=LS.g('oc_csv'),ct=+LS.g('oc_time')||0;
const cch=LS.g('oc_chart');if(cch&&(+LS.g('oc_ctime')||0)>BUILT)TCH=parseChart(cch);
apply(cache&&ct>BUILT?cache:CSV);
if(cache&&ct>BUILT)$('#sst').textContent='保存データ '+hm(new Date(ct));else $('#sst').textContent='埋め込みデータ '+hm(new Date(BUILT));
sync(LS.g('oc_url')||SHEET,false);
const pm=location.hash.match(/^#p=(.*)$/);if(pm){PTID=decodeURIComponent(pm[1]).split('~').filter(Boolean).slice(0,6);savePt();tab('party')}
const m=location.hash.match(/^#c(\d+)$/);if(m&&DATA[+m[1]])detail(+m[1]);
